name: Gemini synthetic connection test

on:
  workflow_dispatch:
    inputs:
      free_tier_confirmed:
        description: Key belongs to the Free Tier project; send one synthetic task
        type: boolean
        required: true
        default: false
      task_json:
        description: Optional synthetic JSON task packet; blank runs the original library test
        type: string
        required: false
        default: ''
      synthetic_confirmed:
        description: Custom packet contains only fictional nonprivate data; public logs are acceptable
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: gemini-synthetic-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/main' && inputs.free_tier_confirmed == true
    runs-on: ubuntu-24.04
    environment: gemini-pilot
    timeout-minutes: 3
    steps:
      - name: Approval policy preflight before credential use
        env:
          APPROVAL_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVAL_REVISION" =~ ^[0-9a-f]{40}$ ]]
          guard_dir=$(mktemp -d "$RUNNER_TEMP/nexus-approval.XXXXXX")
          trap 'rm -rf -- "$guard_dir"' EXIT
          for file in approval_gate.py approval_policy.json; do
            curl --fail --silent --show-error --max-time 30 --proto '=https' \
              "https://raw.githubusercontent.com/sovereignmystic92-dot/nexus-v3-sandbox-/$APPROVAL_REVISION/tools/$file" \
              -o "$guard_dir/$file"
          done
          python3 -I "$guard_dir/approval_gate.py" --policy "$guard_dir/approval_policy.json" \
            --workflow gemini-smoke.yml --revision "$APPROVAL_REVISION"
      - name: Fetch the public script at this exact workflow commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          curl --fail --silent --show-error --max-time 30 --proto '=https' \
            "https://raw.githubusercontent.com/sovereignmystic92-dot/nexus-v3-sandbox-/${SOURCE_SHA}/integrations/gemini/smoke.py" \
            -o "$RUNNER_TEMP/nexus-gemini-smoke.py"
      - name: One synthetic Gemini request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_PILOT_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: 'true'
          NEXUS_TASK_JSON: ${{ inputs.task_json }}
          NEXUS_SYNTHETIC_CONFIRMED: ${{ inputs.synthetic_confirmed }}
        run: python3 -I "$RUNNER_TEMP/nexus-gemini-smoke.py"

