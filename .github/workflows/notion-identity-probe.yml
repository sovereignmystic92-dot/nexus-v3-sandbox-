name: Notion sandbox credential identity
on:
  workflow_dispatch:
    inputs:
      identity_confirmed:
        description: Read token bot identity; publish only Nexus Sandbox name and bot UUID
        required: true
        type: boolean
        default: false
permissions: {}
concurrency:
  group: notion-sandbox-read-probe
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'sovereignmystic92-dot/nexus-v3-sandbox-' && github.ref == 'refs/heads/main' && inputs.identity_confirmed == true
    runs-on: ubuntu-24.04
    environment: notion-sandbox
    timeout-minutes: 2
    steps:
      - name: Approval policy preflight before credential use
        env:
          APPROVAL_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVAL_REVISION" =~ ^[0-9a-f]{40}$ ]]
          guard_dir=$(mktemp -d "$RUNNER_TEMP/nexus-approval.XXXXXX")
          trap 'rm -rf -- "$guard_dir"' EXIT
          for file in approval_gate.py approval_policy.json; do
            curl --fail --silent --show-error --max-time 30 --proto '=https' \
              "https://raw.githubusercontent.com/sovereignmystic92-dot/nexus-v3-sandbox-/$APPROVAL_REVISION/tools/$file" \
              -o "$guard_dir/$file"
          done
          python3 -I "$guard_dir/approval_gate.py" --policy "$guard_dir/approval_policy.json" \
            --workflow notion-identity-probe.yml --revision "$APPROVAL_REVISION"
      - name: Fetch exact public script without credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          curl --fail --silent --show-error --max-time 30 --proto '=https' \
            "https://raw.githubusercontent.com/sovereignmystic92-dot/nexus-v3-sandbox-/${SOURCE_SHA}/tools/notion_identity_probe.py" \
            -o "$RUNNER_TEMP/notion_identity_probe.py"
      - name: Observe credential bot identity
        env:
          NOTION_SANDBOX_TOKEN: ${{ secrets.NOTION_SANDBOX_TOKEN }}
          NOTION_IDENTITY_CONFIRMED: 'true'
        run: python3 -I "$RUNNER_TEMP/notion_identity_probe.py"

