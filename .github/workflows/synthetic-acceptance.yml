name: Isolated synthetic acceptance

on:
  push:
    branches: [main, foundation-audit-draft, mission-scenarios, cortex-adapter]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Public source fetch needs no token. No secrets or write scopes are passed.
permissions: {}

concurrency:
  group: nexus-synthetic-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    if: github.repository == 'sovereignmystic92-dot/nexus-v3-sandbox-'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_EVENT: ${{ github.event_name }}
      SOURCE_REF: ${{ github.ref }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_BASE_REF: ${{ github.base_ref }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_NOSYSTEM: '1'
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - name: Fetch exact public source without credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir checkout
          cd checkout
          git init --quiet
          git -c credential.helper= fetch --depth=1 https://github.com/sovereignmystic92-dot/nexus-v3-sandbox-.git "$SOURCE_SHA"
          git checkout --detach --quiet FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 tools/verify_ci_source.py
      - name: Approval policy preflight
        env:
          APPROVAL_REVISION: ${{ github.sha }}
        run: python3 -I checkout/tools/approval_gate.py --workflow synthetic-acceptance.yml --revision "$APPROVAL_REVISION"
      - name: Check container boundary and run synthetic suite
        working-directory: checkout
        shell: bash
        run: python3 tools/run_isolated.py
      - name: Verify real container cleanup after runner SIGTERM
        working-directory: checkout
        shell: bash
        run: python3 tools/real_container_stop_probe.py

# No schedule, production deployment, external adapters, uploaded artifacts,
# paid runner label, repository merge, or secret-dependent action is included.


