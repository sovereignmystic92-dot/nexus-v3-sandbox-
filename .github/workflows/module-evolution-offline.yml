name: Module evolution offline acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: module-evolution-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    if: github.repository == 'sovereignmystic92-dot/nexus-v3-sandbox-'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Fetch exact public source without credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet checkout
          cd checkout
          git -c credential.helper= fetch --depth=1 https://github.com/sovereignmystic92-dot/nexus-v3-sandbox-.git "$SOURCE_SHA"
          git checkout --detach --quiet FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Test durable event receipts and fail-closed handling
        working-directory: checkout
        run: |
          python3 -m unittest discover -s tests/unit -p 'test_module_evolution_runner.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_dot_nexus_adapter.py' -v
      - name: Exercise offline event ingestion and independent readback
        working-directory: checkout
        shell: bash
        run: |
          set -euo pipefail
          export TEST_DB="$RUNNER_TEMP/module-evolution.sqlite"
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          event = {
              "repository": "sovereignmystic92-dot/nexus-v3-sandbox-",
              "event": "workflow_run", "event_id": os.environ["GITHUB_RUN_ID"],
              "subject": os.environ["SOURCE_SHA"],
              "source_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "module_hints": ["skill_forge"]
          }
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "event.json"
          path.write_text(json.dumps(event))
          cmd = [sys.executable, "tools/module_evolution_runner.py", "--database", os.environ["TEST_DB"], "--event-file", str(path)]
          first = json.loads(subprocess.check_output(cmd))
          second = json.loads(subprocess.check_output(cmd))
          assert first == second
          assert first["status"] == "PENDING_VALIDATION"
          assert first["readiness_advanced"] is False
          # Export a portable checkpoint and restore it in a separate process
          # and database. This is still job-local; no cross-run store is claimed.
          export = [sys.executable, "-c",
                    "import sys; sys.path.insert(0, 'tools'); from module_evolution_snapshot import save_snapshot; save_snapshot(sys.argv[1], sys.argv[2])",
                    os.environ["TEST_DB"], str(path.with_suffix(".snapshot.json"))]
          subprocess.check_call(export)
          recovered = str(path.with_suffix(".restored.sqlite"))
          restore = [sys.executable, "-c",
                     "import sys; sys.path.insert(0, 'tools'); from module_evolution_snapshot import load_snapshot; assert load_snapshot(sys.argv[1], sys.argv[2]) == 1",
                     recovered, str(path.with_suffix(".snapshot.json"))]
          subprocess.check_call(restore)
          restored = json.loads(subprocess.check_output(
              [sys.executable, "tools/module_evolution_runner.py", "--database", recovered, "--event-file", str(path)]))
          assert restored == first
          # Produce an immutable job artifact; a future run must independently
          # authenticate, download, verify, and import before trusting it.
          artifact_dir = pathlib.Path(os.environ["RUNNER_TEMP"]) / "module-evolution-evidence"
          artifact_dir.mkdir(exist_ok=True)
          (artifact_dir / "checkpoint.json").write_bytes(path.with_suffix(".snapshot.json").read_bytes())
          (artifact_dir / "receipt.json").write_text(json.dumps(first, sort_keys=True) + "\n")
          print(json.dumps({"result": "OFFLINE_PASS", "status": first["status"], "module_hints": first["modules"], "provider_writes": 0}))
          PY

      - name: Publish offline checkpoint artifact for future verified readback
        uses: actions/upload-artifact@v4
        with:
          name: module-evolution-offline-${{ github.run_id }}
          path: ${{ runner.temp }}/module-evolution-evidence/
          if-no-files-found: error
          retention-days: 7

# Artifact publication does not constitute a verified cross-run readback.
# Future readers must verify the workflow identity, run SHA, provenance,
# and snapshot digest before importing any artifact.

# This workflow tests a synthetic event envelope. It does not subscribe to
# external workflow_run events, persist records beyond the job, or advance Cortex.
