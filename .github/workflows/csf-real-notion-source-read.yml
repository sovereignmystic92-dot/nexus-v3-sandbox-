name: CSF real Notion source read-only pilot
on:
  workflow_dispatch:
    inputs:
      read_confirmed:
        description: "Authorize one read-only retrieval of the archived Haiti transcript"
        required: true
        type: boolean
        default: false
      prepare_review_packet:
        description: "Validate review packet metadata only; requires excerpt extraction"
        required: true
        type: boolean
        default: false
      extract_excerpts:
        description: "Metadata-only unverified source excerpt extraction; requires bounded segments"
        required: true
        type: boolean
        default: false
      bounded_segments:
        description: "When preparing segments, use bounded source-offset chunks"
        required: true
        type: boolean
        default: false
      prepare_segments:
        description: "Also prepare CSF segments in memory; metadata only, no external writes"
        required: true
        type: boolean
        default: false
permissions: {}
concurrency:
  group: csf-real-notion-source-read
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'sovereignmystic92-dot/nexus-v3-sandbox-' && github.ref == 'refs/heads/main' && inputs.read_confirmed == true
    runs-on: ubuntu-24.04
    environment: notion-sandbox
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticated metadata-only readback of canonical archived source
        env:
          NOTION_SANDBOX_TOKEN: ${{ secrets.NOTION_SANDBOX_TOKEN }}
          NOTION_CSF_SEGMENTS_ONLY: ${{ inputs.prepare_segments }}
          NOTION_CSF_BOUNDED: ${{ inputs.bounded_segments }}
          NOTION_CSF_EXCERPTS: ${{ inputs.extract_excerpts }}
          NOTION_CSF_REVIEW_PACKET: ${{ inputs.prepare_review_packet }}
        run: python3 -I tools/notion_csf_authenticated_source_probe.py
# No transcript artifacts, external writes, Gemini calls, or Cortex calls.
