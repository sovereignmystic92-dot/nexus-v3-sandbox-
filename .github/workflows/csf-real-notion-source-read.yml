name: CSF real Notion source read-only pilot
on:
  workflow_dispatch:
    inputs:
      read_confirmed:
        description: "Authorize one read-only retrieval of the archived Haiti transcript"
        required: true
        type: boolean
        default: false
permissions: {}
concurrency:
  group: csf-real-notion-source-read
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'sovereignmystic92-dot/nexus-v3-sandbox-' && github.ref == 'refs/heads/main' && inputs.read_confirmed == true
    runs-on: ubuntu-24.04
    environment: notion-sandbox
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticated metadata-only readback of canonical archived source
        env:
          NOTION_SANDBOX_TOKEN: ${{ secrets.NOTION_SANDBOX_TOKEN }}
        run: python3 -I tools/notion_csf_authenticated_source_probe.py
# No transcript artifacts, external writes, Gemini calls, or Cortex calls.
