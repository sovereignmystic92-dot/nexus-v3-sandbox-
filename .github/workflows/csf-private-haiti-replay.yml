name: CSF private Haiti batch replay
on:
  workflow_dispatch:
    inputs:
      replay_confirmed:
        description: Authorize read-only replay of the protected Haiti batch and pinned Notion source
        required: true
        type: boolean
        default: false
permissions: {}
concurrency:
  group: csf-private-haiti-replay
  cancel-in-progress: false
jobs:
  replay:
    if: github.repository == 'sovereignmystic92-dot/nexus-v3-sandbox-' && github.ref == 'refs/heads/main' && inputs.replay_confirmed == true
    runs-on: ubuntu-24.04
    environment: notion-sandbox
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 616eb0690673d9f0ebe4253a61f33e23aa574932
          path: implementation
          persist-credentials: false
      - name: Verify private saved batch against the pinned source
        env:
          NOTION_SANDBOX_TOKEN: ${{ secrets.NOTION_SANDBOX_TOKEN }}
          CSF_HAITI_BATCH_B64: ${{ secrets.CSF_HAITI_BATCH_B64 }}
        run: python3 -I driver/tools/csf_private_runner_replay.py implementation
# No schedules, source/SQLite uploads, provider writes, Gemini calls or audit promotion.
# CSF_HAITI_BATCH_B64 is not configured by this change. Transfer needs owner authorization.
