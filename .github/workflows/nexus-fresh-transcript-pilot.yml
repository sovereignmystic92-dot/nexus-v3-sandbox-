name: Fresh Notion transcript source handoff
on:
  schedule:
    - cron: '7 * * * *'
permissions: {}
concurrency:
  group: fresh-transcript-bejwo1yuk8c
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'sovereignmystic92-dot/nexus-v3-sandbox-' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: nexus-transcript-pilot
    timeout-minutes: 4
    steps:
      - name: Fetch the exact public workflow revision
        env:
          SOURCE_SHA: ${{ github.sha }}
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init --quiet checkout
          git -C checkout -c credential.helper= fetch --depth=1 https://github.com/sovereignmystic92-dot/nexus-v3-sandbox-.git "$SOURCE_SHA"
          git -C checkout checkout --detach --quiet FETCH_HEAD
          test "$(git -C checkout rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Verify the pinned Notion archive
        env:
          NOTION_TOKEN: ${{ secrets.NEXUS_NOTION_READ_TOKEN }}
        run: python3 -I checkout/tools/fresh_transcript_pilot.py
      - name: Publish metadata-only receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexus-fresh-source-ready-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-ready.json
          if-no-files-found: error
          retention-days: 14
