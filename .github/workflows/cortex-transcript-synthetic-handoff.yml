name: Nexus Cortex transcript synthetic handoff

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: nexus-cortex-handoff-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.repository == 'sovereignmystic92-dot/nexus-v3-sandbox-' &&
      github.event.sender.login == 'sovereignmystic92-dot' &&
      github.event.issue.user.login == 'sovereignmystic92-dot' &&
      github.event.issue.title == '[Nexus synthetic transcript event]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact public source without credentials
        env:
          SOURCE_SHA: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir checkout
          cd checkout
          git init --quiet
          git -c credential.helper= fetch --depth=1 https://github.com/sovereignmystic92-dot/nexus-v3-sandbox-.git "$SOURCE_SHA"
          git checkout --detach --quiet FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Validate synthetic event without provider access
        working-directory: checkout
        env:
          GITHUB_EVENT_FILE: ${{ github.event_path }}
        run: |
          set -euo pipefail
          python3 -I tools/cortex_transcript_issue_gate.py "$GITHUB_EVENT_FILE"

# No token, secrets, outbound provider calls, execution worker or writes.
# This only observes owner-opened synthetic issues; not a Cortex webhook.
