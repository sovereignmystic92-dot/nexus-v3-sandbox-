name: WarFronts caption adapter unit tests

on:
  push:
    branches: [main]
    paths:
      - 'src/nexus_sandbox/warfronts_*.py'
      - 'tests/test_warfronts_*.py'
      - '.github/workflows/warfronts-source-tests.yml'
  pull_request:
    paths:
      - 'src/nexus_sandbox/warfronts_*.py'
      - 'tests/test_warfronts_*.py'
      - '.github/workflows/warfronts-source-tests.yml'
  workflow_dispatch:

permissions: {}

jobs:
  warfronts-source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute WarFronts tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_warfronts_*.py' -v
