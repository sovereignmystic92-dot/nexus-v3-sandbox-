name: CP05 authenticated Notion fixture read-only probe
on:
  workflow_dispatch:
    inputs:
      read_confirmed:
        description: "Authorize one read-only Notion fixture retrieval; no Cortex or writes"
        required: true
        type: boolean
        default: false
permissions: {}
concurrency:
  group: cp05-authenticated-notion-read
  cancel-in-progress: false
jobs:
  notion-fixture:
    if: github.repository == 'sovereignmystic92-dot/nexus-v3-sandbox-' && inputs.read_confirmed == true
    runs-on: ubuntu-24.04
    environment: notion-sandbox
    timeout-minutes: 3
    steps:
      - name: Checkout reviewed verifier without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read exact synthetic Notion source and write evidence
        env:
          NOTION_SANDBOX_TOKEN: ${{ secrets.NOTION_SANDBOX_TOKEN }}
          FIXTURE_ID: 40e8c067-daa4-8199-9f12-c9b6486de444
          HOST_RUN_ID: ${{ github.run_id }}
          HOST_JOB_NAME: notion-fixture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools").resolve()))
          from cp05_notion_snapshot import check_snapshot
          token = os.environ.get("NOTION_SANDBOX_TOKEN", "")
          page_id = os.environ["FIXTURE_ID"]
          if not token: sys.exit("BLOCKED: sandbox token unavailable")
          headers = {"Authorization": "Bearer " + token, "Notion-Version": "2022-06-28", "Accept": "application/json"}
          def read(path):
              req = urllib.request.Request("https://api.notion.com/v1/" + path, headers=headers, method="GET")
              with urllib.request.urlopen(req, timeout=15) as response:
                  if response.status != 200: raise ValueError("non-200 provider response")
                  return json.load(response)
          try:
              before = read("pages/" + page_id)
              blocks, cursor = [], None
              for _ in range(100):
                  path = "blocks/" + page_id + "/children?page_size=100"
                  if cursor:
                      from urllib.parse import quote
                      path += "&start_cursor=" + quote(cursor, safe="")
                  result = read(path)
                  if not isinstance(result.get("results"), list): raise ValueError("incomplete inventory")
                  blocks.extend(result["results"])
                  if not result.get("has_more"): break
                  cursor = result.get("next_cursor")
                  if not cursor: raise ValueError("missing pagination cursor")
              else: raise ValueError("pagination bound exceeded")
              after = read("pages/" + page_id)
              receipt = check_snapshot(before, blocks, after)
              receipt.update({"schema": "NEXUS_CP05_NOTION_SOURCE_SNAPSHOT_V1", "notion_page_id": page_id,
                              "github_run_id": int(os.environ["HOST_RUN_ID"]),
                              "github_job_name": os.environ["HOST_JOB_NAME"],
                              "mode": "READ_ONLY", "cortex_host_auth": "NOT_ATTESTED"})
              Path("cp05-source-receipt.json").write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
              print(json.dumps({"result": "MATCHED_READ_ONLY", "block_count": receipt["block_count"],
                                "source_revision": receipt["source_revision"], "checkpoint": "NOT_ATTESTED", "writes": 0}))
          except Exception as exc:
              print("BLOCKED: authenticated fixture read failed (" + type(exc).__name__ + ")")
              sys.exit(1)
          PY
      - name: Retain source receipt for independent review
        uses: actions/upload-artifact@v4
        with:
          name: cp05-notion-source-receipt
          path: cp05-source-receipt.json
          if-no-files-found: error
          retention-days: 30
