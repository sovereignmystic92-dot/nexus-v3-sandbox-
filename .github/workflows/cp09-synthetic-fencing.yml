name: CP09 synthetic fencing regressions
on:
  pull_request:
    paths:
      - 'src/nexus_sandbox/cp09_fencing_model.py'
      - 'tests/test_cp09_fencing_model.py'
      - '.github/workflows/cp09-synthetic-fencing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-fencing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run bounded offline CP09 tests
        env:
          PYTHONPATH: src
        run: python3 -m unittest discover -s tests -p test_cp09_fencing_model.py -v
