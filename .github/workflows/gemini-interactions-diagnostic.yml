name: Gemini Interactions authentication diagnostic

on:
  workflow_dispatch:
    inputs:
      free_tier_confirmed:
        description: Confirm key belongs to a free-tier project and authorize one small live API call
        type: boolean
        required: true
        default: false

permissions: {}

concurrency:
  group: gemini-interactions-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && inputs.free_tier_confirmed == true
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Install Gemini SDK
        run: python3 -m pip install --disable-pip-version-check 'google-genai>=2.9,<3'
      - name: Verify advertised model and one GenerateContent request
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, sys
          from google import genai

          key = os.getenv("GEMINI_API_KEY", "")
          if not key:
              sys.exit("FAIL: missing GEMINI_API_KEY")
          client = genai.Client(api_key=key)
          try:
              result = client.models.generate_content(
                  model="gemini-2.5-flash",
                  contents="Reply with exactly: NEXUS_OK",
              )
          except Exception as exc:
              # Never emit exception text, headers, request data, or the key.
              code = getattr(exc, "code", None)
              if not isinstance(code, int):
                  code = getattr(exc, "status_code", None)
              if not isinstance(code, int):
                  code = "UNAVAILABLE"
              name = type(exc).__name__
              if not re.fullmatch(r"[A-Za-z_]{1,80}", name):
                  name = "Exception"
              detail = str(exc).lower()
              if code in (401, 403):
                  category = "AUTH_OR_PERMISSION"
              elif code == 429:
                  category = "QUOTA_OR_RATE_LIMIT"
              elif code == 404:
                  category = "MODEL_OR_ENDPOINT_NOT_FOUND"
              elif code == 400 and any(term in detail for term in ("model", "not supported", "unsupported")):
                  category = "MODEL_OR_FEATURE_UNSUPPORTED"
              elif code == 400 and any(term in detail for term in ("generation_config", "input", "invalid argument", "field")):
                  category = "REQUEST_SCHEMA_REJECTED"
              elif code == 400:
                  category = "BAD_REQUEST_UNCLASSIFIED"
              else:
                  category = "OTHER_API_ERROR"
              # Only fixed allowlisted labels are emitted, never provider text.
              print("GENERATE_CONTENT_FAILED", "http_status:", code, "exception_type:", name, "category:", category)
              sys.exit(1)
          candidates = getattr(result, "candidates", None) or []
          if not candidates:
              sys.exit("FAIL: no candidates returned")
          print("GENERATE_CONTENT_RESPONSE_RECEIVED", "candidates:", len(candidates))
          # Do not print model output; successful transport alone is diagnostic.
          PY
