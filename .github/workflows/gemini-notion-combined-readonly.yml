name: Gemini Notion combined read-only handshake
on:
  workflow_dispatch:
    inputs:
      combined_confirmed:
        description: "Owner confirms synthetic Gemini proposal and read-only Notion fixture check"
        required: true
        type: boolean
        default: false
permissions: {}
concurrency:
  group: gemini-notion-combined-readonly
  cancel-in-progress: false
jobs:
  gemini:
    if: github.repository == 'sovereignmystic92-dot/nexus-v3-sandbox-' && github.ref == 'refs/heads/main' && inputs.combined_confirmed == true
    runs-on: ubuntu-24.04
    environment: gemini-pilot
    timeout-minutes: 4
    outputs:
      fixture_id: ${{ steps.validate.outputs.fixture_id }}
      validated: ${{ steps.validate.outputs.validated }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: validate
        name: Validate synthetic Gemini proposal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_PILOT_API_KEY }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'google-genai>=1,<3'
          python3 - <<'PY'
          import os, subprocess, sys, json
          from google import genai
          key = os.environ.get("GEMINI_API_KEY")
          if not key:
              sys.exit("BLOCKED: Gemini pilot key unavailable")
          prompt = ("Return ONLY a JSON object with exactly four keys: "
                    "schema_version (integer 1), page_id (string "
                    "40e8c067daa481999f12c9b6486de444), marker (string "
                    "NXS-GEMINI-NOTION-SYNTHETIC-V1), summary (ASCII string 1-160 "
                    "characters, letters numbers spaces and basic punctuation only). "
                    "The summary should say this is a fictional metadata bridge test. "
                    "No markdown, no additional fields, no personal data.")
          client = genai.Client(api_key=key)
          try:
              response = client.models.generate_content(
                  model="gemini-3.5-flash-lite", contents=prompt)
          finally:
              client.close()
          raw = getattr(response, "text", "") or ""
          result = subprocess.run([sys.executable, "-I", "tools/gemini_notion_bridge.py"],
                                  input=raw, text=True, capture_output=True, timeout=10)
          if result.returncode:
              sys.exit("BLOCKED: Gemini output failed strict validation")
          report = json.loads(result.stdout)
          if report.get("result") != "VALIDATED_DRY_RUN" or report.get("writes_attempted") != 0:
              sys.exit("BLOCKED: unexpected validation result")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("fixture_id=40e8c067daa481999f12c9b6486de444\n")
              out.write("validated=true\n")
          print(json.dumps({"result": "GEMINI_SYNTHETIC_VALIDATED", "writes_attempted": 0}))
          PY
  notion:
    needs: gemini
    if: needs.gemini.result == 'success' && needs.gemini.outputs.validated == 'true' && needs.gemini.outputs.fixture_id == '40e8c067daa481999f12c9b6486de444'
    runs-on: ubuntu-24.04
    environment: notion-sandbox
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independently verify same bound fixture without writes
        env:
          NOTION_SANDBOX_TOKEN: ${{ secrets.NOTION_SANDBOX_TOKEN }}
          NOTION_BRIDGE_READ_CONFIRMED: "true"
        run: python3 -I tools/gemini_notion_fixture_readback.py
# Sequential, not atomic. No shared provider credentials, writes, or Cortex calls.
