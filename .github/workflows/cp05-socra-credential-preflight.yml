name: CP05 Socra runner credential preflight
on:
  workflow_dispatch:
permissions: {}
jobs:
  socra-credential-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secret presence without exposing values
        env:
          SOCRA_CLIENT_ID: ${{ secrets.SOCRA_CLIENT_ID }}
          SOCRA_CLIENT_SECRET: ${{ secrets.SOCRA_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SOCRA_CLIENT_ID" || -z "$SOCRA_CLIENT_SECRET" ]]; then
            echo "BLOCKED: one or more required Socra secrets are unavailable to this job" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "PASS: both Socra secret names resolve to nonempty values in this runner context" >> "$GITHUB_STEP_SUMMARY"
          echo "NOT VERIFIED: credentials validity, OAuth installation, effective Cortex access, and CP05 readback" >> "$GITHUB_STEP_SUMMARY"
