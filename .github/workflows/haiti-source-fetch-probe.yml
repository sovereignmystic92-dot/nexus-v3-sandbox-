name: Haiti public transcript live fetch probe
on:
  pull_request:
    paths:
      - 'src/nexus_sandbox/warfronts_source_transfer.py'
      - 'tests/test_warfronts_source_transfer.py'
      - '.github/workflows/haiti-source-fetch-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe exact public transcript retrieval without private credentials
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import hashlib
          from nexus_sandbox.warfronts_source_transfer import fetch_episode, START, END
          try:
              candidate = fetch_episode()
              print("PUBLIC_SOURCE_FETCH=PASS")
              print("candidate_sha256=" + hashlib.sha256(candidate.encode("utf-8")).hexdigest())
              print("candidate_utf16_units=" + str(len(candidate.encode("utf-16-le")) // 2))
              print("opening_marker=" + str(candidate.startswith(START)))
              print("ending_marker=" + str(candidate.endswith(END)))
              print("NO_NOTION_SOURCE_PROVIDED; NO_FULL_DIFF; NO_ARCHIVE_WRITES")
          except Exception as exc:
              print("PUBLIC_SOURCE_FETCH=FAIL")
              print("error_type=" + type(exc).__name__)
              print("error_message=" + str(exc)[:300])
              raise
          PY
