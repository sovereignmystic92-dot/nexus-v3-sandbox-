name: Nexus gateway runtime unit CI
on:
  pull_request:
    paths:
      - 'src/nexus_sandbox/nexus_gateway_runtime.py'
      - 'tests/test_nexus_gateway_runtime.py'
      - '.github/workflows/nexus-runtime-ci.yml'
      - 'tools/workflow_policy.json'
  workflow_dispatch:
permissions: {}
jobs:
  runtime-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test runtime and durable receipts
        run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_nexus_gateway_runtime.py' -v
